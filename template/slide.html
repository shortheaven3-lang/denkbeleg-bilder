<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family:'Archivo'; src:url('../fonts/Archivo.ttf'); font-weight:100 900; }
  @font-face { font-family:'Inter'; src:url('../fonts/Inter.ttf'); font-weight:100 900; }
  @font-face { font-family:'JBMono'; src:url('../fonts/JetBrainsMono.ttf'); font-weight:100 800; }

  :root{
    --papier:#F5F2EC;
    --tinte:#16191D;
    --marker:#FFE45C;
    --quelle:#6B7280;
    --stempel:#C2352B;
    --raster:#E4DFD4;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:1080px;height:1350px;}
  body{
    background:var(--papier);
    color:var(--tinte);
    font-family:'Inter',sans-serif;
    position:relative;
    overflow:hidden;
  }

  /* Randraster, nur angedeutet */
  .raster{
    position:absolute;inset:0;pointer-events:none;z-index:0;
    background-image:
      linear-gradient(var(--raster) 1px, transparent 1px),
      linear-gradient(90deg, var(--raster) 1px, transparent 1px);
    background-size:54px 54px;
    -webkit-mask-image:linear-gradient(to bottom, rgba(0,0,0,.55) 0 3%, transparent 8% 92%, rgba(0,0,0,.55) 97% 100%),
                        linear-gradient(to right, rgba(0,0,0,.55) 0 4%, transparent 10% 90%, rgba(0,0,0,.55) 96% 100%);
    -webkit-mask-composite:source-over;
    opacity:.9;
  }

  .blatt{
    position:relative;z-index:2;
    width:100%;height:100%;
    padding:104px 96px 92px;
    display:flex;flex-direction:column;
  }

  .zaehler{
    position:absolute;top:52px;right:96px;
    font-family:'JBMono',monospace;font-weight:500;
    font-size:24px;letter-spacing:.06em;color:var(--quelle);
  }

  mark{background:linear-gradient(transparent 12%, var(--marker) 12% 88%, transparent 88%);color:inherit;padding:0 .06em;}
  b,strong{font-weight:700;}
  em{font-style:italic;}

  /* Slide 1: Haken */
  .haken{justify-content:center;align-items:center;text-align:center;padding:120px 108px;}
  .haken h1{
    font-family:'Archivo',sans-serif;font-weight:700;
    font-size:76px;line-height:1.14;letter-spacing:-.022em;
    max-width:820px;
  }
  .haken .unterzeile{
    margin-top:56px;font-size:33px;line-height:1.45;font-style:italic;
    color:#3C4148;max-width:700px;
  }

  /* Inhaltsslides */
  .kopf{
    font-family:'Archivo',sans-serif;font-weight:700;
    font-size:54px;line-height:1.16;letter-spacing:-.018em;
    margin-bottom:44px;max-width:880px;
  }
  .fliess{font-size:35px;line-height:1.5;max-width:890px;}
  .fliess p + p{margin-top:30px;}

  .quelle{
    margin-top:auto;padding-top:38px;
    border-top:1px solid rgba(22,25,29,.16);
    font-family:'JBMono',monospace;font-weight:400;
    font-size:22px;letter-spacing:.01em;color:var(--quelle);
  }

  /* Stempel fuer die Rubrik WIDERLEGT */
  .stempel{
    position:absolute;z-index:4;top:150px;right:52px;
    transform:rotate(9deg);
    border:5px solid var(--stempel);border-radius:10px;
    padding:12px 26px 14px;
    font-family:'Archivo',sans-serif;font-weight:800;
    font-size:42px;letter-spacing:.09em;color:var(--stempel);
    opacity:.86;
  }

  /* Abschluss */
  .ende{justify-content:flex-end;padding-bottom:150px;}
  .ende .merksatz{
    font-family:'Archivo',sans-serif;font-weight:700;
    font-size:58px;line-height:1.2;letter-spacing:-.018em;max-width:800px;
  }
  .ende .handle{
    margin-top:64px;font-size:32px;line-height:1.45;color:#3C4148;max-width:720px;
  }
  .ende .handle span{font-weight:600;color:var(--tinte);}
</style>
</head>
<body>
<div class="raster"></div>
__STEMPEL__
<div class="blatt __KLASSE__">
  __ZAEHLER__
  __INHALT__
</div>
</body>
</html>
